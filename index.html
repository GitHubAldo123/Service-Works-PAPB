<!DOCTYPE html> 
<html lang="id"> 
<head> 
<meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <!-- Menentukan warna tema browser --> 
    <meta name="theme-color" content="#0056b3"> 
    <title>PWA Modul 1</title> 
     
    <!-- Menghubungkan CSS --> 
    <link rel="stylesheet" href="css/style.css"> 
     
    <!-- Menghubungkan Web App Manifest --> 
    <link rel="manifest" href="manifest.json"> 
</head> 
<body> 
    <!-- Banner peringatan saat jaringan terputus --> 
    <div id="offline-banner" class="offline-warning" style="display: none;"> 
        Anda sedang dalam mode offline. Beberapa fitur mungkin terbatas. 
    </div> 
 
    <header class="app-header"> 
        <h1>PWA Pertamaku</h1> 
        <!-- Tombol instalasi (disembunyikan secara default) --> 
        <button id="install-btn" class="install-btn" style="display: none;"> 
            Install Aplikasi 
        </button> 
    </header>
     
    <main class="app-content"> 
    <div class="card"> 
        <h2>Catatan Offline</h2> 
         
        <!-- Form Input Data --> 
         <div class="form-group"> 
            <!-- Input tersembunyi untuk menyimpan ID saat mode Edit --> 
            <input type="hidden" id="note-id"> 
            <input type="text" id="note-title" placeholder="Judul Catatan..." required> 
        </div>
        <div class="form-group"> 
            <textarea id="note-body" placeholder="Isi catatan..." rows="4" 
required></textarea> 
        </div> 
        <button id="save-btn" class="btn">Simpan Catatan</button> 
         
        <!-- Wadah untuk Menampilkan Data --> 
        <div class="notes-container"> 
            <h3>Daftar Catatan:</h3> 
            <ul id="note-list"> 
                <!-- Data akan dimuat ke sini melalui JavaScript --> 
            </ul> 
        </div> 
    </div> 
</main>

    <!-- mulai dari sini -->

<script src="js/db.js"></script>
<script> 
        // Memastikan browser mendukung Service Worker 
        if ('serviceWorker' in navigator) { 
            window.addEventListener('load', () => { 
                navigator.serviceWorker.register('sw.js') 
                    .then((registration) => { 
                        console.log('Service Worker berhasil didaftarkan dengan scope:', registration.scope); 
                    }) 
                    .catch((error) => { 
                        console.error('Pendaftaran Service Worker gagal:', error); 
                    }); 
            }); 
        } else { 
            console.log('Browser Anda tidak mendukung Service Worker.'); 
        } 
    </script>
<script> 
    // Memastikan browser mendukung Service Worker 
    if ('serviceWorker' in navigator) { 
        window.addEventListener('load', () => { 
            navigator.serviceWorker.register('sw.js') 
                .then((registration) => { 
                    console.log('Service Worker berhasil didaftarkan dengan scope:', registration.scope); 
                }) 
                .catch((error) => { 
                    console.error('Pendaftaran Service Worker gagal:', error); 
                }); 
        }); 
    } else { 
        console.log('Browser Anda tidak mendukung Service Worker.'); 
    } 
</script>
    <!-- sampe sini -->
</body> 
</html>
